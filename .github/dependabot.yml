version: 2
updates:
  # Security fixes arrive as they are published; routine bumps are grouped
  # into one weekly PR so they do not bury a team of three.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
