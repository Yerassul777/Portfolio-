<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f0d" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <title>Нет подключения — Portfolio+</title>
    <!-- Shown by the service worker for a page that was never opened before.
         Self-contained: it must work with no network at all. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at 80% 10%, rgba(16, 185, 129, 0.1), transparent 420px), #0a0f0d;
        color: #f0fdf4;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      .logo {
        display: inline-flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #10b981, #16a34a);
        font-weight: 700;
        font-size: 22px;
      }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #9ca3af; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      button, a {
        min-height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        text-decoration: none;
      }
      button { border: 0; color: #fff; background: linear-gradient(90deg, #10b981, #16a34a); }
      a { border: 1px solid rgba(52, 211, 153, 0.25); color: #d1fae5; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">P+</div>
      <h1>Нет подключения к интернету</h1>
      <p>Эта страница ещё не сохранена на устройстве. Страницы, которые вы уже открывали, доступны и без сети.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Попробовать снова</button>
        <a href="/ru">Открыть каталог</a>
      </div>
    </main>
  </body>
</html>
